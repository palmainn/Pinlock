<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181d;--mu:#6c7683;--ac:#2563eb;--ok:#16a34a;--no:#dc2626;--bd:#e5e8ec;--soft:#eef2f7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1216;--card:#181c22;--tx:#eef1f5;--mu:#98a2b0;--ac:#5b9bff;--ok:#34c77b;--no:#ff6b6b;--bd:#262c35;--soft:#20262e;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1216;--card:#181c22;--tx:#eef1f5;--mu:#98a2b0;--ac:#5b9bff;--ok:#34c77b;--no:#ff6b6b;--bd:#262c35;--soft:#20262e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:560px;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:92px}
button,input,select{font:inherit;color:inherit}
label{display:block;font-size:.85rem;color:var(--mu);margin-top:12px}
input,select{width:100%;min-width:0;height:46px;padding:0 12px;margin:6px 0 0;border:1px solid var(--bd);border-radius:12px;background:var(--soft);outline:0}
input:focus,select:focus{border-color:var(--ac);background:var(--card)}

button{height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;transition:transform .12s,opacity .12s}
button:active,.cd:active{transform:scale(.96);opacity:.85}
button.d{background:transparent;color:var(--no);border:1px solid var(--bd)}
button.g{background:var(--soft);color:var(--tx)}
h2{margin:0 0 4px;font-size:1.45rem}h3{margin:0 0 6px;font-size:1.05rem}
small{color:var(--mu);display:block;font-size:.85rem;margin-top:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card>button:not(.big){margin-top:12px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px}.row>*{min-width:0}
.card.row{margin:12px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px;gap:8px}.top b{font-size:1.15rem}.top .row{margin:0}.top button{height:36px;padding:0 12px;font-size:.85rem}
.tabs{display:flex;gap:4px;margin:6px 12px 8px;padding:4px;background:var(--soft);border-radius:14px}
.tabs button{flex:1;height:38px;padding:0 4px;background:transparent;color:var(--mu);font-size:.88rem}
.tabs .on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.big{width:100%;height:auto;padding:40px 10px;font-size:1.45rem;border-radius:20px;background:var(--ok);box-shadow:0 8px 20px rgba(22,163,74,.28)}

.pill{padding:4px 12px;border-radius:99px;background:var(--soft);font-size:.8rem;font-weight:600;color:var(--mu)}.pill.ok{background:rgba(22,163,74,.15);color:var(--ok)}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--soft);padding:2px 8px;border-radius:8px;letter-spacing:.08em;font-weight:700;color:var(--tx)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:12px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:18px}
.cal>span{text-align:center;font-size:.72rem;color:var(--mu);font-weight:600;padding-bottom:2px}
.cal>i{visibility:hidden}
.cd{aspect-ratio:1/1.05;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:2px solid transparent;font-size:.95rem;min-width:0;transition:transform .12s}
.cd em{font-style:normal;font-size:.62rem;color:var(--ok);font-weight:700;height:.9em;line-height:.9}
.cd .dt{width:5px;height:5px;border-radius:50%;background:var(--ac);visibility:hidden}.cd.sh .dt{visibility:visible}
.cd.w{background:rgba(22,163,74,.14)}.cd.td b{color:var(--ac)}.cd.sel{border-color:var(--ac)}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd)}
.bar button{display:flex;gap:8px;align-items:center;background:var(--soft);color:var(--tx)}.bar .on{background:var(--ac);color:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ok);color:#fff;padding:10px 16px;border-radius:12px;display:none;max-width:90%;z-index:9;font-weight:600}#toast.er{background:var(--no)}
.lg{padding:36px 20px 0;text-align:center}.lg>svg{margin:0 auto 14px}.lg h2{font-size:1.6rem}.lg .sub{margin:2px 0 0;color:var(--mu)}
.dots{display:flex;justify-content:center;gap:16px;margin:26px 0 30px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mu);transition:all .12s}
.dots i.on{background:var(--tx);border-color:var(--tx);transform:scale(1.08)}
.dots.err{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;justify-content:center}
.pad button{width:76px;height:76px;border-radius:50%;padding:0;font-size:1.9rem;font-weight:500;background:var(--soft);color:var(--tx)}
.pad button.g{background:transparent;font-size:1.4rem;color:var(--mu)}.pad button:active{background:var(--bd)}
.rem{display:flex;gap:8px;justify-content:center;align-items:center;margin:24px 0 0;font-size:.9rem;color:var(--mu)}.rem input{width:20px;height:20px;margin:0}
.us{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 24px}
.chip{display:flex;align-items:center;background:var(--soft);border-radius:99px;padding-left:6px}
.chip>button{height:44px;background:transparent;color:var(--tx);padding:0 8px;display:flex;align-items:center;gap:8px}
.chip .av{width:32px;height:32px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.chip .x{width:36px;padding:0;color:var(--mu);font-size:1.2rem}
.lk{color:var(--ac);cursor:pointer;font-weight:600}
.wd{display:flex;gap:6px;margin-top:6px}.wd button{flex:1;height:40px;padding:0;background:var(--soft);color:var(--mu)}.wd .on{background:var(--ac);color:#fff}
.tabs button{font-size:.8rem}
textarea{width:100%;padding:10px 12px;margin:6px 0 0;border:1px solid var(--bd);border-radius:12px;background:var(--soft);font:inherit;color:inherit;outline:0;resize:none}textarea:focus{border-color:var(--ac);background:var(--card)}
input[type=search]{-webkit-appearance:none;appearance:none}
input[type=color]{width:46px;height:34px;padding:2px;margin:0;flex:none}
.sw{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}.sw button{width:34px;height:34px;padding:0;border-radius:50%;flex:none}
.evt{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.85rem;font-weight:700}
.cd em{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.card.r.pend{border-color:var(--ac)}
.sv{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:5}
.sv button{width:100%;height:50px;box-shadow:0 8px 20px rgba(37,99,235,.35)}.sv button.g{box-shadow:none;border:1px solid var(--bd)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.mo .card{margin:0;width:100%;max-width:420px}
.ic{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center}

<script>
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SB_URL='https://yfkpfuwkxfpixkuaufmo.supabase.co',SB_KEY='sb_publishable_LH9ZzXrNfUGhU3PCA_7pEg_lVgpmbm5';
const S={companies:[],people:[],punches:[],notes:[],shifts:[],sess:null,cr:null,ask:0,tab:'in',db:null,wk:0,mo:0,n:0,fp:'',edit:'',del:'',nc:'',dirty:0,day:'',last:''};
try{const x=JSON.parse(sessionStorage.getItem('fs')||'{}');S.sess=x.sess||null;S.cr=x.cr||null;if(!S.cr)S.sess=null}catch(e){}

const A=()=>({k:S.cr.k||null,c:S.cr.c||null,adm:S.cr.adm||null});
async function rpc(fn,args){const h={'Content-Type':'application/json',apikey:SB_KEY};if(SB_KEY.startsWith('eyJ'))h.Authorization='Bearer '+SB_KEY;const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)});if(!r.ok)throw new Error('Servidor '+r.status);return r.json()}
async function put(t,i,d,m){if(!await rpc('app_put',{...A(),p_tbl:t,p_id:i,p_data:d,p_merge:m}))throw new Error('Sin permiso');await load()}

async function load(){if(!S.cr)return;try{const r=await rpc('app_fetch',A());if(!r){S.sess=null;S.cr=null;S.n=0;save();draw(1);return}const d=r.data||{},j=JSON.stringify(d);if(j===S.last&&S.n===5&&!S.dirty)return;S.last=j;for(const n of ['companies','people','punches','notes','shifts'])S[n]=d[n]||[];S.n=5;draw()}catch(e){toast('Sin conexión con el servidor',1)}}
const HELP_HO=`<div class="card"><b>Horario de trabajo</b><small>Elige la persona arriba. En «Nuevo turno» escoge <b>Toda la semana</b> para poner el mismo horario en varios días de una vez (marca los días que trabaja; si ya había turno esos días, se sustituye), o <b>Un día</b> para un solo turno. En la lista, el botón <b>Guardar</b> de cada bloque guarda solo ese día; <b>Guardar todo</b> (abajo) guarda de golpe todos los cambios pendientes.</small></div>`;

const toL=t=>new Date(t-new Date(t).getTimezoneOffset()*6e4).toISOString().slice(0,16);

const opt=(a,sel)=>a.map(([v,t])=>`<option value="${E(v)}"${v===sel?' selected':''}>${E(t)}</option>`).join('');

const gen=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(const x of crypto.getRandomValues(new Uint8Array(6)))s+=c[x%c.length];return s};
async function newId(){const r=await rpc('app_newcode',A());if(!r)throw new Error('Sin permiso');return r}
let tt;function toast(m,er){const t=$('#toast');t.textContent=m;t.className=er?'er':'';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2800)}
async function W(fn,ok){try{await fn();toast(ok||'Guardado');return true}catch(e){toast('Error al guardar: '+(e.message||e.code||e),1);return false}}
function draw(f){const a=document.activeElement;if(!f&&((a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&$('#app').contains(a))||$('#app .r.pend'))){S.dirty=1;return}S.dirty=0;
 const keep={};if(f!==1)document.querySelectorAll('#app [id]').forEach(x=>{if(/INPUT|SELECT|TEXTAREA/.test(x.tagName))keep[x.id]=x.value});

 for(const id in keep){const x=document.getElementById(id);if(x&&x.value!==keep[id]&&(x.tagName!=='SELECT'||[...x.options].some(o=>o.value===keep[id])))x.value=keep[id]}

function supList(){const w0=mon(Date.now()),q=nz(S.q.trim()),mt=(...a)=>a.some(x=>nz(x).includes(q));let out='';
 for(const c of [...S.companies].sort((a,b)=>(a.name||'').localeCompare(b.name||''))){
  const ps=S.people.filter(p=>p.cid===c.id).sort((a,b)=>(a.role===b.role?0:a.role==='admin'?-1:1)||(a.name||'').localeCompare(b.name||'')),cm=!q||mt(c.name,c.id),pm=q?ps.filter(p=>mt(p.name,p.id)):[];
  if(!cm&&!pm.length)continue;const op=S.open===c.id||(q&&pm.length>0),list=q&&pm.length?pm:ps;
  out+=`<div class="card"><div class="row" style="margin:0;cursor:pointer;flex-wrap:nowrap" data-a="co" data-id="${c.id}"><div><b>${E(c.name)}</b><small>${ps.length} personas · código <span class="code">${c.id}</span></small></div><div class="row" style="margin:0;gap:6px;flex-wrap:nowrap"><button class="d ic" data-a="dco" data-id="${c.id}" aria-label="Eliminar empresa" title="Eliminar empresa">${TR}</button><span style="font-size:1.3rem;color:var(--mu)">${op?'⌃':'⌄'}</span></div></div>`+
  (op?list.map(p=>{const dentro=S.punches.some(x=>x.pid===p.id&&!x.out);return `<div class="row" style="border-top:1px solid var(--bd);padding-top:10px;align-items:flex-start"><div><b>${E(p.name)}</b><small>${E(p.place||'—')} · ${p.role==='admin'?'Jefe':'Empleado'}</small><small>${+p.wk||40}h/sem · esta semana ${H(sumR(p.id,w0,addD(w0,7)))}</small></div><div style="text-align:right"><span class="code">${p.id}</span><small><span class="pill ${dentro?'ok':''}">${dentro?'Dentro':'Fuera'}</span></small></div></div>`}).join('')+`<div class="row"><span></span><button data-a="enter" data-id="${c.id}">Entrar y gestionar</button></div>`:'')+`</div>`}
 return out||`<div class="card"><small>Sin resultados.</small></div>`}
function sup(){return nc()+`<div class="card" style="padding:10px"><input id="qs" type="search" placeholder="Buscar local, empleado o código…" value="${E(S.q)}" autocomplete="off" style="margin:0"></div><h3 style="margin:14px 16px 0">Empresas</h3><div id="sl">${supList()}</div><div class="card"><h3>Nueva empresa</h3><input id="cn" placeholder="Nombre de la empresa"><input id="ca" placeholder="Nombre del primer jefe"><input id="cl" placeholder="Local / lugar"><button data-a="addc">Crear empresa y jefe</button></div>`}

/* ACCIONES */
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,id=b.dataset.id,s=S.sess;
 const v=k=>{const el=$('#'+k);return el?el.value.trim():''};
 if(['dp','ds','dn','delp','dev'].includes(a)){if(S.del!==id){S.del=id;draw(2);return}S.del='';const col={dp:'punches',ds:'shifts',dn:'notes',delp:'people',dev:'shifts'}[a];
  await W(async()=>{if(a==='delp'){for(const x of S.punches.filter(x=>x.pid===id))await S.db.doc('punches/'+x.id).delete();for(const x of S.shifts.filter(x=>x.pid===id))await S.db.doc('shifts/'+x.id).delete();S.edit=''}await S.db.doc(col+'/'+id).delete()},'Borrado');draw(1);return}
 switch(a){
 case'key':press(b.dataset.n);break;
 case'kdel':back();break;
 case'chk':S.kc='';S.ck='';S.pin='';LS.s('fx_k','');draw(1);break;
 case'ru':doLogin(b.dataset.k,b.dataset.c);break;
 case'rx':S.users=S.users.filter(u=>u.c!==b.dataset.c);LS.s('fx_u',S.users);draw(2);break;
 case'out':S.last='';S.sess=null;S.cr=null;S.n=0;S.nc='';save();draw(1);break;
 case'back':S.sess={role:'super',cid:null};S.nc='';save();draw(1);break;
 case'enter':S.sess={role:'super',cid:id};S.tab='eq';S.fp='';save();draw(1);break;
 case'sup':S.ask=1;S.pin='';draw(1);break;
 case'noask':S.ask=0;S.pin='';draw(1);break;
  case'tab':if(pendN()){toast('Guarda antes los cambios pendientes (Guardar todo)',1);break}S.tab=b.dataset.k;S.del='';draw(1);break;
 case'nav':if(pendN()){toast('Guarda antes los cambios pendientes',1);break}S[b.dataset.w]+=+b.dataset.d;draw(2);break;
 case'day':{S.day=b.dataset.d;draw(2);const e2=$('#evd');if(e2)e2.value=S.day;break}
 case'nc':S.nc='';draw(1);break;
 case'clock':{b.disabled=true;await W(async()=>{if(!await rpc('app_clock',{k:S.cr.k,c:S.cr.c}))throw new Error('No se pudo fichar');await load()},'Fichaje registrado');break}
 case'addc':{const n=v('cn'),an=v('ca'),pl=v('cl');if(!n||!an){toast('Falta el nombre de la empresa o del jefe',1);break}
  await W(async()=>{const cid=await newId();let aid;do aid=await newId();while(aid===cid);await S.db.doc('companies/'+cid).set({name:n,created:Date.now()});await S.db.doc('people/'+aid).set({cid,name:an,place:pl,role:'admin',wk:40,created:Date.now()});S.nc=`Empresa ${n} · código empresa ${cid} · código de ${an}: ${aid}`},'Empresa creada');draw(1);break}
 case'addp':{const n=v('nn');if(!n){toast('Falta el nombre',1);break}const role=v('nr')||'worker',wk=+v('nw')||40,pl=v('np');
  await W(async()=>{const pid=await newId();await S.db.doc('people/'+pid).set({cid:s.cid,name:n,place:pl,role,wk,created:Date.now()});S.nc=`Código de ${n}: ${pid}`},'Persona creada');draw(1);break}
 case'edit':S.edit=id;S.del='';draw(1);break;
 case'cancel':S.edit='';S.del='';draw(1);break;
 case'savep':{if(!v('en')){toast('Falta el nombre',1);break}await W(()=>S.db.doc('people/'+id).update({name:v('en'),place:v('ep'),role:v('er'),wk:+v('ew')||40}));S.edit='';draw(1);break}
 case'sp':{const r=b.closest('.r'),i=fromL(r.querySelector('.i1').value),ov=r.querySelector('.i2').value,o=ov?fromL(ov):null;if(isNaN(i)||(o!==null&&(isNaN(o)||o<=i))){toast('Horas no válidas',1);break}if(await W(()=>S.db.doc('punches/'+id).update({in:i,out:o}),'Fichaje guardado')){r.classList.remove('pend');updPend();draw()}break}
 case'ap':{const p=fp(),i=fromL(v('ai')),ov=v('ao'),o=ov?fromL(ov):null;if(isNaN(i)||(o!==null&&(isNaN(o)||o<=i))){toast('Horas no válidas',1);break}await W(()=>S.db.collection('punches').add({cid:s.cid,pid:p.id,in:i,out:o}),'Fichaje añadido');draw(1);break}
 case'ss':{const r=b.closest('.r'),d=r.querySelector('.i1').value,s1=r.querySelector('.i2').value,s2=r.querySelector('.i3').value;if(!d||!s1||!s2){toast('Faltan datos',1);break}if(await W(()=>S.db.doc('shifts/'+id).update({date:d,s:s1,e:s2}),'Día guardado')){r.classList.remove('pend');updPend();draw()}break}
 case'em':S.em=b.dataset.m;draw(2);break;
 case'ed':{const i=+b.dataset.i;S.ed=S.ed.includes(i)?S.ed.filter(x=>x!==i):[...S.ed,i];draw(2);break}
 case'ecp':{const e2=$('#evc');if(e2)e2.value=b.dataset.c;break}
 case'ae':{const p=fp(),name=v('evn'),d=v('evd'),s1=v('ev1'),s2=v('ev2'),col=evc(v('evc')),nt=v('evt');
  if(!name||!d){toast('Faltan el nombre o el día',1);break}if(!!s1!==!!s2){toast('Pon entrada y salida, o deja las dos vacías',1);break}
  const wkm=S.em==='week';if(wkm&&!S.ed.length){toast('Elige algún día',1);break}
  let dates=[d];if(wkm){const m0=mon(fromL(d+'T00:00'));dates=[...S.ed].sort().map(i=>ymd(addD(m0,i)))}
  await W(async()=>{for(const dt of dates){if(!await rpc('app_put',{...A(),p_tbl:'shifts',p_id:crypto.randomUUID(),p_data:{cid:s.cid,pid:p.id,kind:'ev',date:dt,name,color:col,s:s1,e:s2,notes:nt},p_merge:false}))throw new Error('Sin permiso')}await load()},dates.length>1?dates.length+' eventos añadidos':'Evento añadido');draw(1);break}
 case'sall':{const rows=[...document.querySelectorAll('#app .r.pend')];if(!rows.length){toast('No hay cambios pendientes');break}const jobs=[];
  for(const r of rows){const rid=r.dataset.id;if(r.dataset.k==='sh'){const d=r.querySelector('.i1').value,s1=r.querySelector('.i2').value,s2=r.querySelector('.i3').value;if(!d||!s1||!s2){toast('Hay turnos con datos incompletos',1);return}jobs.push(['shifts',rid,{date:d,s:s1,e:s2}])}
   else{const i=fromL(r.querySelector('.i1').value),ov=r.querySelector('.i2').value,o=ov?fromL(ov):null;if(isNaN(i)||(o!==null&&(isNaN(o)||o<=i))){toast('Hay fichajes con horas no válidas',1);return}jobs.push(['punches',rid,{in:i,out:o}])}}
  if(await W(async()=>{for(const [t,rid,data] of jobs){if(!await rpc('app_put',{...A(),p_tbl:t,p_id:rid,p_data:data,p_merge:true}))throw new Error('Sin permiso')}await load()},jobs.length+' cambios guardados')){rows.forEach(r=>r.classList.remove('pend'));draw(1)}break}
 case'dco':S.delco=id;draw(2);break;
 case'dcn':S.delco='';draw(2);break;
 case'dcy':{const cid=S.delco;if(!cid)break;const docs=[...S.people.filter(x=>x.cid===cid).map(x=>['people',x.id]),...S.punches.filter(x=>x.cid===cid).map(x=>['punches',x.id]),...S.shifts.filter(x=>x.cid===cid).map(x=>['shifts',x.id]),...S.notes.filter(x=>x.cid===cid).map(x=>['notes',x.id]),['companies',cid]];
  toast('Eliminando…');
  const ok=await W(async()=>{for(let i=0;i<docs.length;i+=10){const rs=await Promise.all(docs.slice(i,i+10).map(([t,x])=>rpc('app_del',{...A(),p_tbl:t,p_id:x})));if(rs.includes(false))throw new Error('No se pudo borrar todo')}S.open='';await load()},'Empresa eliminada');
  S.delco='';draw(1);break}
 case'hm':S.hm=b.dataset.m;draw(2);break;
 case'wd':{const i=+b.dataset.i;S.hd=S.hd.includes(i)?S.hd.filter(x=>x!==i):[...S.hd,i];draw(2);break}
 case'co':S.open=S.open===id?'':id;draw(2);break;
 case'as':{const p=fp(),d=v('sd'),s1=v('s1'),s2=v('s2');if(!d||!s1||!s2){toast('Faltan datos',1);break}const wkm=S.hm==='week';if(wkm&&!S.hd.length){toast('Elige algún día',1);break}
  let dates=[d];if(wkm){const m0=mon(fromL(d+'T00:00'));dates=[...S.hd].sort().map(i=>ymd(addD(m0,i)))}
  await W(async()=>{for(const dt of dates){const ex=wkm?S.shifts.find(x=>x.pid===p.id&&x.date===dt&&x.kind!=='ev'):null;if(!await rpc('app_put',{...A(),p_tbl:'shifts',p_id:ex?ex.id:crypto.randomUUID(),p_data:{cid:s.cid,pid:p.id,date:dt,s:s1,e:s2},p_merge:false}))throw new Error('Sin permiso')}await load()},dates.length>1?dates.length+' turnos añadidos':'Turno añadido');draw(1);break}
 case'sn':{const x=v('nx');if(!x){toast('Escribe un mensaje',1);break}await W(()=>S.db.collection('notes').add({cid:s.cid,to:v('nt')||'all',text:x,ts:Date.now()}),'Aviso enviado');draw(1);break}
 }});

draw(1);if(S.cr&&S.sess)load();setInterval(load,10000);
</script></body></html>
